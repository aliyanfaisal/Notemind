[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "notescos"
version = "0.0.1"
description = "Notemind: a local-first notes and follow-up tracker for Claude Code."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
notescos = "notescos.cli:run"

[tool.setuptools.packages.find]
where = ["core"]
